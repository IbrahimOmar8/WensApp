# Local MySQL for development: docker compose up -d
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wens
      MYSQL_USER: wens
      MYSQL_PASSWORD: wens
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - wens-db:/var/lib/mysql

volumes:
  wens-db:
